<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title description">
  <title id="title">Naveen Upadhyay — security research in three dimensions</title>
  <desc id="description">A neon cyan and violet three-dimensional N floats in an orbital security grid beside Naveen Upadhyay's name and specialties.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#07111e"/>
      <stop offset=".52" stop-color="#0a1d30"/>
      <stop offset="1" stop-color="#060d19"/>
    </linearGradient>
    <radialGradient id="aura">
      <stop stop-color="#16e0d4" stop-opacity=".27"/>
      <stop offset=".48" stop-color="#305cb8" stop-opacity=".12"/>
      <stop offset="1" stop-color="#050e19" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="front" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#efffff"/>
      <stop offset=".34" stop-color="#56f4de"/>
      <stop offset=".78" stop-color="#57a6fa"/>
      <stop offset="1" stop-color="#a68cff"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#1f6387"/>
      <stop offset="1" stop-color="#513d8f"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#41e3d2" stop-opacity="0"/>
      <stop offset=".5" stop-color="#41e3d2" stop-opacity=".8"/>
      <stop offset="1" stop-color="#a896ff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#93bed6" stroke-opacity=".08" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <clipPath id="frame"><rect width="1200" height="430" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="430" fill="url(#background)"/>
    <rect width="1200" height="430" fill="url(#grid)"/>
    <circle cx="895" cy="212" r="345" fill="url(#aura)"/>
    <path d="M0 353C207 260 312 423 507 331S838 256 1200 325" fill="none" stroke="#62e9db" stroke-opacity=".1" stroke-width="2"/>
    <path d="M-30 370C226 288 379 448 589 355S965 285 1250 352" fill="none" stroke="#ae9bff" stroke-opacity=".1" stroke-width="2"/>

    <rect x="56" y="54" width="152" height="29" rx="14.5" fill="#29e9d8" fill-opacity=".09" stroke="#42e9dc" stroke-opacity=".36"/>
    <circle cx="72" cy="68.5" r="3" fill="#5ff9e4"/>
    <text x="86" y="73" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" letter-spacing="2.2" fill="#8cf9e9">GREYHAT127  /  01</text>
    <text x="55" y="161" font-family="Arial,Helvetica,sans-serif" font-size="58" font-weight="800" letter-spacing="-2.8" fill="#f0fbff">NAVEEN</text>
    <text x="55" y="224" font-family="Arial,Helvetica,sans-serif" font-size="58" font-weight="800" letter-spacing="-2.8" fill="url(#front)">UPADHYAY</text>
    <path d="M57 249H513" stroke="url(#line)" stroke-width="2"/>
    <text x="57" y="284" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" letter-spacing="2.2" fill="#c3e9f1">CYBERSECURITY  •  DIGITAL FORENSICS</text>
    <text x="57" y="312" font-family="Arial,Helvetica,sans-serif" font-size="14" letter-spacing="1.55" fill="#90aebe">PENETRATION TESTING  /  SECURITY RESEARCH</text>
    <text x="57" y="377" font-family="Arial,Helvetica,sans-serif" font-size="11" letter-spacing="2.3" fill="#67a3b9">DISCOVER  ·  INVESTIGATE  ·  BUILD</text>

    <g fill="none" stroke-linecap="round">
      <circle cx="900" cy="216" r="171" stroke="#3cb6d4" stroke-opacity=".19"/>
      <circle cx="900" cy="216" r="137" stroke="#8ea6e9" stroke-opacity=".16" stroke-dasharray="3 9"/>
      <circle cx="900" cy="216" r="103" stroke="#4bdddd" stroke-opacity=".1"/>
      <ellipse cx="900" cy="216" rx="227" ry="77" transform="rotate(-24 900 216)" stroke="#46e5dc" stroke-opacity=".46" stroke-width="1.5"/>
      <ellipse cx="900" cy="216" rx="227" ry="77" transform="rotate(39 900 216)" stroke="#a18aff" stroke-opacity=".32" stroke-width="1.5"/>
      <ellipse cx="900" cy="216" rx="187" ry="119" transform="rotate(17 900 216)" stroke="#64aefb" stroke-opacity=".25" stroke-dasharray="5 8"/>
    </g>
    <path d="M900 52L1035 130V284L900 362L765 284V130Z" fill="#12263b" fill-opacity=".14" stroke="#7a8eef" stroke-opacity=".38" stroke-width="1.5"/>
    <path d="M900 52V362M765 130L1035 284M1035 130L765 284" fill="none" stroke="#78c0db" stroke-opacity=".12"/>
    <path d="M900 88L1002 145V269L900 328L798 269V145Z" fill="#0d2e44" fill-opacity=".5" stroke="#4df1e1" stroke-opacity=".24"/>
    <path d="M798 145L900 204L1002 145M900 204V328" fill="none" stroke="#75d5ed" stroke-opacity=".22"/>
    <circle cx="900" cy="216" r="89" fill="#4cebdc" opacity=".13" filter="url(#glow)"/>
    <text x="832" y="287" font-family="Arial,Helvetica,sans-serif" font-size="210" font-weight="900" fill="#41398f" opacity=".75">N</text>
    <text x="821" y="276" font-family="Arial,Helvetica,sans-serif" font-size="210" font-weight="900" fill="#46d9e8" opacity=".68" filter="url(#soft)">N</text>
    <text x="821" y="276" font-family="Arial,Helvetica,sans-serif" font-size="210" font-weight="900" fill="url(#front)" stroke="#b9fff5" stroke-opacity=".42" stroke-width="1.4">N</text>

    <g fill="#9effef">
      <circle cx="695" cy="241" r="4"/>
      <circle cx="1096" cy="159" r="4"/>
      <circle cx="900" cy="45" r="3"/>
    </g>
    <g fill="none" stroke="#70eadd" stroke-opacity=".58">
      <circle cx="695" cy="241" r="10"/>
      <circle cx="1096" cy="159" r="10"/>
    </g>
    <text x="1004" y="72" font-family="monospace" font-size="11" letter-spacing="2" fill="#85abc4">43° 08' N</text>
    <text x="1026" y="368" font-family="monospace" font-size="11" letter-spacing="2" fill="#85abc4">SYSTEM / ACTIVE</text>
    <path d="M0 420H1200" stroke="#60e7d7" stroke-opacity=".45" stroke-width="2"/>
  </g>
</svg>
