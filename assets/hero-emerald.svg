<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title description">
  <title id="title">Naveen Upadhyay — security research in three dimensions</title>
  <desc id="description">A neon cyan and violet three-dimensional N floats in an orbital security grid beside Naveen Upadhyay's name and specialties.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#03130d"/>
      <stop offset=".52" stop-color="#071e17"/>
      <stop offset="1" stop-color="#020b08"/>
    </linearGradient>
    <radialGradient id="aura">
      <stop stop-color="#00ed91" stop-opacity=".27"/>
      <stop offset=".48" stop-color="#0a7d4b" stop-opacity=".12"/>
      <stop offset="1" stop-color="#030e0a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="front" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ecfff4"/>
      <stop offset=".34" stop-color="#7dffc1"/>
      <stop offset=".78" stop-color="#2ee59d"/>
      <stop offset="1" stop-color="#d8fa69"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0c6340"/>
      <stop offset="1" stop-color="#526a20"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#39f5a3" stop-opacity="0"/>
      <stop offset=".5" stop-color="#39f5a3" stop-opacity=".8"/>
      <stop offset="1" stop-color="#b3e676" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#8dcfb0" stroke-opacity=".08" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <clipPath id="frame"><rect width="1200" height="430" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="430" fill="url(#background)"/>
    <rect width="1200" height="430" fill="url(#grid)"/>
    <circle cx="895" cy="212" r="345" fill="url(#aura)"/>
    <path d="M0 353C207 260 312 423 507 331S838 256 1200 325" fill="none" stroke="#62f1a0" stroke-opacity=".1" stroke-width="2"/>
    <path d="M-30 370C226 288 379 448 589 355S965 285 1250 352" fill="none" stroke="#a8df5f" stroke-opacity=".1" stroke-width="2"/>

    <rect x="56" y="54" width="152" height="29" rx="14.5" fill="#2bffa2" fill-opacity=".09" stroke="#67ffb5" stroke-opacity=".36"/>
    <circle cx="72" cy="68.5" r="3" fill="#a8ffcc"/>
    <text x="86" y="73" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" letter-spacing="2.2" fill="#adffd0">GREYHAT127  /  01</text>
    <text x="55" y="161" font-family="Arial,Helvetica,sans-serif" font-size="58" font-weight="800" letter-spacing="-2.8" fill="#f0fbff">NAVEEN</text>
    <text x="55" y="224" font-family="Arial,Helvetica,sans-serif" font-size="58" font-weight="800" letter-spacing="-2.8" fill="url(#front)">UPADHYAY</text>
    <path d="M57 249H513" stroke="url(#line)" stroke-width="2"/>
    <text x="57" y="284" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" letter-spacing="2.2" fill="#c9f5dc">CYBERSECURITY  •  DIGITAL FORENSICS</text>
    <text x="57" y="312" font-family="Arial,Helvetica,sans-serif" font-size="14" letter-spacing="1.55" fill="#88b29a">PENETRATION TESTING  /  SECURITY RESEARCH</text>
    <text x="57" y="377" font-family="Arial,Helvetica,sans-serif" font-size="11" letter-spacing="2.3" fill="#79b990">DISCOVER  ·  INVESTIGATE  ·  BUILD</text>

    <g fill="none" stroke-linecap="round">
      <circle cx="900" cy="216" r="171" stroke="#3ccb83" stroke-opacity=".19"/>
      <circle cx="900" cy="216" r="137" stroke="#9ad66b" stroke-opacity=".16" stroke-dasharray="3 9"/>
      <circle cx="900" cy="216" r="103" stroke="#38e596" stroke-opacity=".1"/>
      <ellipse cx="900" cy="216" rx="227" ry="77" transform="rotate(-24 900 216)" stroke="#45ffa6" stroke-opacity=".46" stroke-width="1.5"/>
      <ellipse cx="900" cy="216" rx="227" ry="77" transform="rotate(39 900 216)" stroke="#d8f773" stroke-opacity=".32" stroke-width="1.5"/>
      <ellipse cx="900" cy="216" rx="187" ry="119" transform="rotate(17 900 216)" stroke="#85d975" stroke-opacity=".25" stroke-dasharray="5 8"/>
    </g>
    <path d="M900 52L1035 130V284L900 362L765 284V130Z" fill="#0c291c" fill-opacity=".14" stroke="#83d76a" stroke-opacity=".38" stroke-width="1.5"/>
    <path d="M900 52V362M765 130L1035 284M1035 130L765 284" fill="none" stroke="#76cb91" stroke-opacity=".12"/>
    <path d="M900 88L1002 145V269L900 328L798 269V145Z" fill="#0b3522" fill-opacity=".5" stroke="#58f5a5" stroke-opacity=".24"/>
    <path d="M798 145L900 204L1002 145M900 204V328" fill="none" stroke="#84e5a5" stroke-opacity=".22"/>
    <circle cx="900" cy="216" r="89" fill="#4dff9e" opacity=".13" filter="url(#glow)"/>
    <text x="832" y="287" font-family="Arial,Helvetica,sans-serif" font-size="210" font-weight="900" fill="#31733f" opacity=".75">N</text>
    <text x="821" y="276" font-family="Arial,Helvetica,sans-serif" font-size="210" font-weight="900" fill="#49ec99" opacity=".68" filter="url(#soft)">N</text>
    <text x="821" y="276" font-family="Arial,Helvetica,sans-serif" font-size="210" font-weight="900" fill="url(#front)" stroke="#c7ffdc" stroke-opacity=".42" stroke-width="1.4">N</text>

    <g fill="#b5ffca">
      <circle cx="695" cy="241" r="4"/>
      <circle cx="1096" cy="159" r="4"/>
      <circle cx="900" cy="45" r="3"/>
    </g>
    <g fill="none" stroke="#79f6af" stroke-opacity=".58">
      <circle cx="695" cy="241" r="10"/>
      <circle cx="1096" cy="159" r="10"/>
    </g>
    <text x="1004" y="72" font-family="monospace" font-size="11" letter-spacing="2" fill="#83b99d">43° 08' N</text>
    <text x="1026" y="368" font-family="monospace" font-size="11" letter-spacing="2" fill="#83b99d">SYSTEM / ACTIVE</text>
    <path d="M0 420H1200" stroke="#72ffac" stroke-opacity=".45" stroke-width="2"/>
  </g>
</svg>
